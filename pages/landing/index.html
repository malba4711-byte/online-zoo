<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div id="header-placeholder"></div>
  <main>
    <section>
      <h2 class="text-h2">Section Topic</h2>
      <p class="text-h3">Content goes here.</p>
      just text
      <div class="text-subheader">
        <div class="">
          other text
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script>
    try {
      fetch('../_header.html')
        .then(response => response.text())
        .then(data => document.getElementById('header-placeholder').innerHTML = data)
        .then(fetch('../_footer.html')
          .then(response => response.text())
          .then(data => document.getElementById('footer-placeholder').innerHTML = data))
        .then(() => {
          const script = document.createElement('script');
          script.src = '../global-scripts.js';
          document.body.appendChild(script);
        })
        .then(highlightActiveLink());
    } catch (error) {
      console.log("Error loading header and footer files with error")
    }

  </script>
</body>

</html>
